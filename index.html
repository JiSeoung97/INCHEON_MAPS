<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>출국장 혼잡도</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.10.0/dist/axios.min.js"></script>
    <script
      id="naverMap"
      type="text/javascript"
      src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=API_KEY&language=ko"
    ></script>
  </head>
  <body>
    <div class="container">
      <div id="map">
        <div id="selectLang"></div>
        <div id="languageChange"></div>
        <div id="boardingInfo"></div>
        <div id="boardingModalOpen">
          <img id="boardingIcon" src="/images/boardingIcon.png" />
        </div>
      </div>
      <div id="bottomSheet">
        <div id="locationContainer" class="peek">
          <div id="requestLocation">
            <img id="gps" src="images/gps_black.svg" />
          </div>
        </div>
        <div id="bottomContainer">
          <!-- <div id="handle" class="peek">
            <img id="handleImg" src="./images/handle.png" />
          </div> -->
          <table id="menu" class="peek">
            <tr>
              <th class="menuBtn" data-idx="0">출국장 혼잡도</th>
              <th class="menuBtn" data-idx="1">예상 소요 시간</th>
            </tr>
          </table>
          <div id="controls">
            <div class="tabs">
              <table>
                <tr>
                  <th id="congestionEx">
                    • 제1여객터미널 혼잡도
                    <span id="questionMark">?</span>
                  </th>
                  <th><p id="nTime"></p></th>
                </tr>
              </table>
            </div>
            <!-- 실제 혼잡도 컨텐츠 -->
            <table id="contents" class="congestion-content hidden">
              <tr class="gate skeleton hidden">
                <th></th>
                <th class="eastWest skeleton"></th>
                <th class="eastWest skeleton"></th>
              </tr>
              <tr class="gate skeleton">
                <th></th>
                <th class="eastWest skeleton"></th>
                <th class="eastWest skeleton"></th>
              </tr>
              <tr class="gate skeleton">
                <th></th>
                <th class="eastWest skeleton"></th>
                <th class="eastWest skeleton"></th>
              </tr>
              <tr class="gate skeleton">
                <th></th>
                <th class="eastWest skeleton"></th>
                <th class="eastWest skeleton"></th>
              </tr>
              <tr class="gate skeleton">
                <th></th>
                <th class="eastWest skeleton"></th>
                <th class="eastWest skeleton"></th>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div id="adModal" class="modal-overlay">
      <div class="modal-content">
        <p id="modalClose">
          <img id="adClose" src="images/x.png" />
        </p>
        <div id="modal-contents">
          <div id="imgBox">
            <img id="modelImg" />
          </div>
          <div id="modalText">
            <p id="modalTryMeal"></p>
            <p id="modalTitle"></p>
          </div>
          <button id="reco">
            <img id="arrow-right" loading="lazy" src="./images/more.svg" />
          </button>
        </div>
      </div>
    </div>
    <div id="modal-background" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <span id="input-gateNum"></span>
          <div class="modal-close">&times;</div>
        </div>
        <div class="input-container">
          <input
            class="gate-input"
            type="number"
            maxlength="3"
            min="1"
            max="132"
          />
        </div>
        <div class="subtext"></div>
        <button class="confirm-btn"></button>
      </div>
    </div>
    <div id="reco-select">
      <table>
        <div class="reco-rank"></div>
        <div class="reco-rank"></div>
        <div class="reco-rank"></div>
      </table>
    </div>
    <div id="trainCenterOverlay" class="modal-overlay">
      <div id="trainCenterModal" class="modal">
        <div id="trainHeader">
          <span id="trainMap"></span>
          <div id="trainClose">&times;</div>
        </div>
        <img id="trainCenterImg" src="" />
        <div id="kioskImg"></div>
        <div id="kioskFlag"></div>
      </div>
    </div>
    <script src="js/bundle.min.js"></script>
    <script>
      // 페이지 로드 완료 후 실행
      window.addEventListener("load", function () {
        console.log("페이지 로드 완료");

        // 지도 컨테이너 확인
        var mapDiv = document.getElementById("map");
        console.log("지도 컨테이너:", mapDiv);
        // 네이버 Maps API 로드 확인

        if (typeof naver !== "undefined" && naver.maps) {
          console.log("네이버 Maps API 로드 성공");
        } else {
          console.error("네이버 Maps API 로드 실패");
        }
      });
    </script>
  </body>
</html>
