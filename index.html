<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>Map-WEB</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
      rel="stylesheet"
    />
    <link rel="preload" href="images/gps_black.svg" as="images" />
    <link rel="preload" href="images/send_black.svg" as="images" />
    <link rel="preload" href="images/flight_blue.svg" as="images" />
    <link rel="preload" href="images/like_icon.svg" as="images" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.10.0/dist/axios.min.js"></script>
    <script
      id="naverMap"
      type="text/javascript"
      src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=API_KEY&language=ko"
    ></script>
  </head>
  <body>
    <div class="container">
      <div id="map"></div>
      <div id="bottomSheet">
        <div id="locationContainer">
          <div id="requestLocation">
            <img id="gps-black" src="images/gps_black.svg" />
            <img id="gps-blue" src="images/gps_blue.svg" />
          </div>
        </div>
        <div id="bottomContainer">
          <div id="handle" class="peek">
            <img id="handleImg" src="./images/handle.png" />
          </div>
          <table id="menu" class="peek">
            <tr>
              <th class="menuBtn" data-idx="0">출국장 혼잡도</th>
              <th class="menuBtn" data-idx="1">약도 보기</th>
            </tr>
          </table>
          <div id="controls">
            <div class="tabs">
              <table>
                <tr>
                  <th id="congestionEx">
                    • 제1여객터미널 혼잡도
                    <span id="questionMark">?</span>
                  </th>
                  <th><p id="nTime"></p></th>
                </tr>
              </table>
            </div>
            <!-- 스켈레톤 ui -->
            <div id="congestion-skeleton" class="loading-skeleton">
              <div class="skeleton-congestion-row">
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-name"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-status"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-time"
                ></div>
              </div>
              <div class="skeleton-congestion-row">
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-name"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-status"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-time"
                ></div>
              </div>
              <div class="skeleton-congestion-row">
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-name"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-status"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-time"
                ></div>
              </div>
              <div class="skeleton-congestion-row">
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-name"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-status"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-time"
                ></div>
              </div>
              <div class="skeleton-congestion-row">
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-name"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-status"
                ></div>
                <div
                  class="skeleton skeleton-congestion-cell skeleton-gate-time"
                ></div>
              </div>
            </div>

            <!-- 실제 혼잡도 컨텐츠 -->
            <table id="contents" class="congestion-content hidden">
              <tr class="gate">
                <th></th>
                <th class="eastWest"></th>
                <th class="eastWest"></th>
              </tr>
              <tr class="gate">
                <th></th>
                <th class="eastWest"></th>
                <th class="eastWest"></th>
              </tr>
              <tr class="gate">
                <th></th>
                <th class="eastWest"></th>
                <th class="eastWest"></th>
              </tr>
              <tr class="gate">
                <th></th>
                <th class="eastWest"></th>
                <th class="eastWest"></th>
              </tr>
              <tr class="gate">
                <th></th>
                <th class="eastWest"></th>
                <th class="eastWest"></th>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div id="adModal" class="modal-overlay">
      <div class="modal-content">
        <p id="modalClose"><img id="adClose" /></p>
        <div id="modal-contents">
          <div id="imgBox">
            <img id="modelImg" />
          </div>
          <div id="modalText">
            <p id="modalTryMeal"></p>
            <p id="modalTitle"></p>
          </div>
          <button id="reco">
            <img id="arrow-right" loading="lazy" src="./images/more.svg" />
          </button>
        </div>
      </div>
    </div>
    <div id="modal-background" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <span id="input-gateNum"></span>
          <div class="modal-close">&times;</div>
        </div>
        <div class="input-container">
          <input
            class="gate-input"
            type="number"
            maxlength="3"
            min="1"
            max="132"
          />
        </div>
        <div class="subtext"></div>
        <button class="confirm-btn"></button>
      </div>
    </div>
    <div id="reco-select">
      <table>
        <div class="reco-rank"></div>
        <div class="reco-rank"></div>
        <div class="reco-rank"></div>
      </table>
    </div>
    <script src="js/bundle.min.js"></script>
    <script>
      // 페이지 로드 완료 후 실행
      window.addEventListener("load", function () {
        console.log("페이지 로드 완료");

        // 지도 컨테이너 확인
        var mapDiv = document.getElementById("map");
        console.log("지도 컨테이너:", mapDiv);
        // 네이버 Maps API 로드 확인

        if (typeof naver !== "undefined" && naver.maps) {
          console.log("네이버 Maps API 로드 성공");
        } else {
          console.error("네이버 Maps API 로드 실패");
        }
      });
    </script>
  </body>
</html>
