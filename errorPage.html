<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 페이지를 찾을 수 없습니다</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="css/error.css" />
  </head>
  <body>
    <!-- 전체 페이지 컨테이너 -->
    <div class="page-container">
      <!-- 404 숫자 텍스트 -->
      <div class="error-code-container">
        <h1 class="error-code" data-text="404">
          <span aria-hidden="true">404</span aria-hidden="true">404<span>404</span>
        </h1>
        <!-- 그림자 효과 -->
        <div class="shadow-effect"></div>
      </div>

      <!-- 메시지 섹션 -->
      <div class="message-container">
        <h2>페이지를 찾을 수 없습니다.</h2>
        <p>
          요청하신 페이지가 사라졌거나, 이름이 변경되었거나, 일시적으로 사용할
          수 없습니다. 주소를 다시 한번 확인해주세요.
        </p>
      </div>

      <!-- 홈으로 돌아가기 버튼 -->
      <div class="button-container">
        <a href="index.local.html" class="home-button"> 홈으로 돌아가기 </a>
      </div>
    </div>
  </body>
</html>
