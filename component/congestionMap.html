<template id="congestionMap">
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    .section {
      padding: 1.2rem;
      border-bottom: 1px solid #eee;
    }
    .section:last-child {
      border-bottom: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #333;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .reset-btn {
      font-size: 0.9rem;
      color: #2196f3;
      cursor: pointer;
    }
    .input-group {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    .input-box {
      flex: 1;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      font-size: 0.95rem;
    }
    .input-label {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 0.4rem;
    }
    .input-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #222;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .clock-icon::after {
      content: "⏰";
      font-size: 1rem;
    }
    .time-summary {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 0.5rem;
    }
    .total-time {
      font-size: 1rem;
      color: #e53935;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .timeline-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      font-size: 0.9rem;
      border-top: 1px solid #f0f0f0;
    }
    .timeline-item:first-child {
      border-top: none;
    }
    .badge {
      background-color: #e3f2fd;
      color: #1976d2;
      font-size: 0.75rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      margin-left: 0.5rem;
    }
    .right {
      color: #333;
      white-space: nowrap;
    }
  </style>
  <div class="card">
    <!-- 탑승 정보 입력 -->
    <div class="section">
      <div class="header">
        <span>탑승 정보 입력</span>
        <span class="reset-btn">
          <img src="../images/reset.svg" alt="?" /> Reset
        </span>
      </div>
      <div class="input-group">
        <div class="input-box">
          <div class="input-label">탑승구</div>
          <div class="input-value">12</div>
        </div>
        <div class="input-box">
          <div class="input-label">탑승 시간</div>
          <div class="input-value">
            오후 2:41 <span class="clock-icon"></span>
          </div>
        </div>
      </div>
    </div>
    <!-- 구간별 소요시간 -->
    <div class="section">
      <div class="time-summary">구간별 예상 소요시간</div>
      <div class="total-time">총 2시간 37분</div>
      <div class="timeline-item">
        <div>Departure Hall 2 West <span class="badge">Best</span></div>
        <div class="right">Pass · 2시간 23분</div>
      </div>
      <div class="timeline-item">
        <div>From duty-free zone to boarding gate</div>
        <div class="right">14분</div>
      </div>
    </div>
  </div>
</template>
