<template id="congestionMap">
  <style>

    :host {
      position: relative;
      display: inline-block;
      width: 100%;
      height: 300px;
      overflow: visible;
    }

    .mapImg {
      position: relative;
      bottom: auto;
      width: 100%;
      overflow: visible;
      object-fit: cover;
      pointer-events: none;
    }
    .bubble-container {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 2000;
    }

    /* Gate별 위치 & 배지 색상 */
    .bubble-container.gate1 { top: 80%; left: 90%}
    .bubble-container.gate2 { top: 52%; left: 80%}
    .bubble-container.gate3 { top: 25%; left: 70%}
    .bubble-container.gate4 { top: 25%; left: 30%}
    .bubble-container.gate5 { top: 52%; left: 20%}
    .bubble-container.gate6 { top: 80%; left: 10%}

    .bubble-group {
      display: inline-flex;
      border-radius: 10px;
      
      background: #fff;
      overflow: hidden;
      
      width: 102px;
      height: 36px;
      box-sizing: border-box;

    }

    .bubble-group1 {
      display: inline-flex;
      border-radius: 10px;
      
      background: #fff;
      overflow: hidden;


      width: 52px;
      height: 36px;
      box-sizing: border-box;
      transform: translateY(15%);
    }
    
    .tags {
        display: inline-flex;
        width: 100%;
        height: 100%;
    }
    .tag .dir {
        font-size: 8px;
        color: #333;
        flex-shrink: 0;
        padding-top: 3px;
        
    }
    .tags .tag {
      padding: 5.5px;
      flex: 1;
      gap:0px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px;
    }
    .notag {
      display: flex;              
      justify-content: center;  
      align-items: center;        
      width: 100%;
      height: 100%;
      font-size: 11.12px;
      color: #999;
      border: 1.5px solid #999999;
      border-radius: 10px;
    }



    .tag span{
      font-size: 11.12px;
    }
    
    .tag .status.medium     { color: #00C73C;}
    .tag .status.low     { color: #32A1FF ;}
    .tag .status.high    { color: #FF823F;}
    .tag .status.veryhigh { color: #FF5959;}



    .num {
      display: inline-flex;
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translate(-50%,30%);
      width: 19px;
      height: 19px;
      line-height: 24px;
      border-radius: 50%;
      background: var(--badge-color, #999);
      color: #fff;
      font-size: 14px;
      justify-content: center;
      align-items: center;
      border: 2px solid #fff;
      box-sizing: border-box;
      z-index: 2000;
    }
  </style>


  <img class="mapImg" src="images/map.png" alt="공항 지도" />

  <div class="bubble-container gate1">
    <div class="bubble-group1">
      <div class="tags">
        <div class="notag">
          <span class="status no-service">미운영</span>
        </div>
      </div>
    </div>
    <span class="num">1</span>
  </div>


  <div class="bubble-container gate2">
    <div class="bubble-group">
      <div class="tags">
        <div class="tag">
        </div>
        <div class="tag">
        </div>
      </div>
    </div>
    <span class="num">2</span>
  </div>

  <div class="bubble-container gate3">
    <div class="bubble-group">
      <div class="tags">
        <div class="tag">
        </div>
        <div class="tag">
        </div>
      </div>
    </div>
    <span class="num">3</span>
  </div>

  <div class="bubble-container gate4">
    <div class="bubble-group">
      <div class="tags">
        <div class="tag">
        </div>
        <div class="tag">
        </div>
      </div>
    </div>
    <span class="num">4</span>
  </div>

  <div class="bubble-container gate5">
    <div class="bubble-group">
      <div class="tags">
        <div class="tag">
        </div>
        <div class="tag">
        </div>
      </div>
    </div>
    <span class="num">5</span>
  </div>

  <div class="bubble-container gate6">
    <div class="bubble-group1">
      <div class="tags">
        <div class="notag">
          <span class="status no-service">미운영</span>
        </div>
      </div>
    </div>
    <span class="num">6</span>
  </div>
</template>
